<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gestión de Pendientes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --or:#F97316;--orl:#FFF7ED;--orm:#FDBA74;
  --nv:#1E3A5F;--nvl:#EEF3FA;--nvm:#2D5F9E;
  --g0:#fff;--g1:#F8FAFC;--g2:#F1F5F9;--g3:#E2E8F0;
  --g4:#94A3B8;--g6:#475569;--g8:#1E293B;
  --ok:#16A34A;--okb:#F0FDF4;
  --wn:#D97706;--wnb:#FFFBEB;
  --er:#DC2626;--erb:#FEF2F2;
  --rd:10px;--sh:0 1px 3px rgba(0,0,0,.07);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--g1);min-height:100vh;font-size:13px;}

/* TOPBAR */
.bar{background:var(--nv);padding:0 18px;display:flex;align-items:center;justify-content:space-between;height:62px;border-bottom:3px solid var(--or);position:sticky;top:0;z-index:50;}
.bar-l{display:flex;align-items:center;gap:10px;}
.tabs{display:flex;gap:3px;}
.tab{padding:5px 11px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:rgba(255,255,255,.55);transition:all .15s;}
.tab:hover{background:rgba(255,255,255,.1);color:#fff;}
.tab.on{background:var(--or);color:#fff;}
.bar-r{display:flex;align-items:center;gap:8px;}
.uinfo{text-align:right;}
.uname{color:rgba(255,255,255,.9);font-size:12px;font-weight:600;line-height:1.3;}
.uclock{color:var(--or);font-size:13px;font-weight:700;line-height:1.3;}
.udate{color:rgba(255,255,255,.45);font-size:10px;line-height:1.3;}
.av{width:28px;height:28px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.av.nv{background:var(--nvm);}

/* LAYOUT */
.wrap{padding:16px;max-width:1020px;margin:0 auto;}

/* SPINNER */
.spin-wrap{display:flex;justify-content:center;padding:60px;}
.spin{width:30px;height:30px;border:3px solid var(--g3);border-top-color:var(--or);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px;}
@media(max-width:560px){.sg{grid-template-columns:repeat(2,1fr);}}
.sc{background:var(--g0);border:0.5px solid var(--g3);border-radius:var(--rd);padding:11px 13px;}
.sl{font-size:10px;color:var(--g4);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;}
.sv{font-size:21px;font-weight:700;color:var(--nv);}
.sv.gr{color:var(--ok);}.sv.rd{color:var(--er);}.sv.or{color:var(--or);}

/* ALERT */
.al{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--rd);font-size:12px;margin-bottom:8px;}
.al.er{background:var(--erb);border:1px solid #FCA5A5;color:var(--er);}
.al.wn{background:var(--wnb);border:1px solid #FDE68A;color:var(--wn);}

/* SECTION */
.sec{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px;}
.sec-t{font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.8px;}
.empty{padding:20px;text-align:center;color:var(--g4);font-size:12px;background:var(--g0);border:0.5px solid var(--g3);border-radius:var(--rd);}

/* WORKERS GRID */
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px;}
@media(max-width:640px){.wg{grid-template-columns:1fr 1fr;}}
.wc{background:var(--g0);border:0.5px solid var(--g3);border-radius:var(--rd);padding:12px;cursor:pointer;transition:all .15s;box-shadow:var(--sh);}
.wc:hover{border-color:var(--or);box-shadow:0 3px 10px rgba(249,115,22,.12);}
.wi{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.wm{display:flex;gap:10px;font-size:11px;color:var(--g6);flex-wrap:wrap;}

/* TABLE */
.card{background:var(--g0);border:0.5px solid var(--g3);border-radius:var(--rd);box-shadow:var(--sh);overflow:hidden;margin-bottom:10px;}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:var(--g1);}
th{padding:7px 9px;text-align:left;font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--g3);white-space:nowrap;}
td{padding:8px 9px;border-bottom:0.5px solid var(--g2);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr.cr td{opacity:.55;background:var(--g1);}

/* PRIORITY INDICATOR */
.prio-ovr{border-left:3px solid var(--er);}
.prio-soon{border-left:3px solid var(--wn);}
.prio-ok{border-left:3px solid transparent;}

/* BADGES */
.bg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:9px;font-size:10px;font-weight:700;}
.bg.pn{background:var(--wnb);color:var(--wn);}
.bg.pr{background:var(--nvl);color:var(--nv);}
.bg.dn{background:var(--okb);color:var(--ok);}
.tg{background:var(--nvl);color:var(--nv);padding:2px 6px;border-radius:7px;font-size:10px;font-weight:600;}
.by{font-size:10px;color:var(--g4);margin-top:2px;}
.sup{font-size:10px;color:var(--or);margin-top:2px;}

/* PROGRESS */
.pb{background:var(--g2);border-radius:3px;height:5px;width:65px;overflow:hidden;}
.pf{height:100%;border-radius:3px;transition:width .4s;}
.pp{font-size:10px;color:var(--g4);margin-top:2px;}

/* ACTION EDITOR */
.ae{display:flex;align-items:center;gap:4px;}
.sel{font-size:11px;border:0.5px solid var(--g3);border-radius:5px;padding:3px 5px;background:#fff;color:var(--g8);cursor:pointer;}
.sab{font-size:10px;padding:3px 8px;border-radius:5px;border:none;background:var(--nv);color:#fff;cursor:pointer;font-weight:600;white-space:nowrap;display:none;}
.sab.show{display:inline-block;}
.sab:hover{opacity:.85;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:600;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.82;}
.btn.or{background:var(--or);color:#fff;}
.btn.nv{background:var(--nvl);color:var(--nv);}
.btn.er{background:var(--erb);color:var(--er);}
.btn.gh{background:transparent;border:1px solid var(--g3);color:var(--g6);}
.btn.nt{background:var(--wnb);color:var(--wn);border:1px solid var(--orm);}
.btn.fl{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;}
.btn-r{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}
.nd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--wn);margin-left:3px;vertical-align:middle;}

/* NOTE */
.nb{margin-top:5px;background:var(--wnb);border:1px solid #FDE68A;border-radius:7px;padding:6px 8px;}
.nb textarea{width:100%;border:none;background:transparent;font-size:11px;color:var(--g8);resize:none;min-height:44px;outline:none;font-family:inherit;line-height:1.5;}

/* FILE */
.fp{margin-top:5px;}
.fp a{font-size:11px;color:var(--nvm);display:inline-flex;align-items:center;gap:3px;text-decoration:none;}
.fp a:hover{text-decoration:underline;}

/* DESC RICH */

.desc-text a{color:var(--nvm);text-decoration:underline;}

/* PROJECTS */

.ph{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;border-left:4px solid var(--or);}

.ph.cp{border-left-color:var(--ok);}
.pt{font-size:13px;font-weight:600;color:var(--nv);}
.pm{font-size:10px;color:var(--g4);margin-top:2px;}
.pr{display:flex;align-items:center;gap:10px;}
.pp2{font-size:17px;font-weight:700;color:var(--or);}
.pbw{width:70px;background:var(--g2);border-radius:4px;height:6px;overflow:hidden;}
.pbf{height:100%;border-radius:4px;transition:width .4s;}
.cv{font-size:16px;color:var(--g4);transition:transform .2s;line-height:1;}
.cv.op{transform:rotate(90deg);}
.pbody{padding:0 14px 12px;border-top:1px solid var(--g2);}
.fhr,.fr{display:grid;grid-template-columns:24px 1fr 130px 95px 125px;gap:5px;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--g2);font-size:12px;}
.fhr{font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--g3);padding-top:9px;}
.fr:last-child{border-bottom:none;}

/* WTABS */
.wt{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
.wtb{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:7px;border:1px solid var(--g3);background:#fff;cursor:pointer;font-size:12px;font-weight:500;color:var(--g6);transition:all .15s;}
.wtb.on{background:var(--nv);color:#fff;border-color:var(--nv);}
.wtb:hover:not(.on){border-color:var(--or);color:var(--or);}

/* TOGGLE COMP */
.tc{background:none;border:1px solid var(--g3);border-radius:7px;padding:5px 11px;font-size:11px;color:var(--g6);cursor:pointer;margin-top:8px;}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(15,25,50,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px;}
.mb{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.mt{font-size:15px;font-weight:700;color:var(--nv);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.xb{background:none;border:none;cursor:pointer;font-size:20px;color:var(--g4);line-height:1;padding:0;}
.fr2{margin-bottom:10px;}
.fl2{font-size:11px;font-weight:700;color:var(--g6);margin-bottom:3px;display:block;}
.fi{width:100%;padding:7px 9px;border:1px solid var(--g3);border-radius:7px;font-size:13px;color:var(--g8);outline:none;font-family:inherit;}
.fi:focus{border-color:var(--nvm);}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.sb{width:100%;background:var(--nv);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;}
.sb:hover{opacity:.85;}

/* SEARCH */
.srch{position:relative;margin-bottom:10px;}
.srch input{width:100%;padding:7px 9px 7px 30px;border:1px solid var(--g3);border-radius:7px;font-size:13px;outline:none;font-family:inherit;}
.srch::before{content:"🔍";position:absolute;left:9px;top:7px;font-size:12px;}
.drop{background:#fff;border:1px solid var(--g3);border-radius:7px;max-height:160px;overflow-y:auto;margin-top:2px;}
.di{padding:7px 10px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;}
.di:hover{background:var(--g1);}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.tag-item{display:inline-flex;align-items:center;gap:4px;background:var(--nvl);color:var(--nv);padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.tag-x{cursor:pointer;font-size:13px;line-height:1;}

/* UPLOAD AREA */
.ua{border:2px dashed var(--g3);border-radius:8px;padding:14px;text-align:center;cursor:pointer;color:var(--g4);font-size:12px;transition:border-color .15s;margin-top:4px;}
.ua:hover{border-color:var(--or);}

/* TOAST */
.tst{position:fixed;bottom:14px;right:14px;background:var(--nv);color:#fff;padding:9px 14px;border-radius:9px;font-size:12px;border-left:4px solid var(--or);z-index:300;max-width:270px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tu .25s ease;}
@keyframes tu{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* LOGIN */
.lw{min-height:100vh;background:var(--nv);display:flex;align-items:center;justify-content:center;padding:20px;}
.lc{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:300px;}
.ll{width:48px;height:48px;background:var(--nv);border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;margin:0 auto 9px;border-bottom:3px solid var(--or);}
.lt{text-align:center;font-size:16px;font-weight:700;color:var(--nv);margin-bottom:2px;}
.ls{text-align:center;font-size:11px;color:var(--g4);margin-bottom:16px;}
.ub{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1.5px solid var(--g3);border-radius:9px;background:#fff;cursor:pointer;width:100%;margin-bottom:6px;transition:all .15s;text-align:left;}
.ub:hover{border-color:var(--or);background:var(--orl);}
</style>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4Ywz5SRwzOfGMZkqxsLAiLxaNPGxIrRXmWz4KTRn4Sb2Bs8IIdRTFlbTcPQPGGGz5/exec";

};

<script>
// ── API ───────────────────────────────────
async function api(action, qp={}, body=null) {
  const u = new URL(SCRIPT_URL);
  u.searchParams.set("action", action);
  Object.entries(qp).forEach(([k,v])=>u.searchParams.set(k,v));
  if(body) u.searchParams.set("payload", encodeURIComponent(JSON.stringify({action,...body})));
  const r = await fetch(u.toString());
  const t = await r.text();
  let j; try{j=JSON.parse(t);}catch(e){throw new Error("Respuesta inválida: "+t.slice(0,80));}
  if(!j.ok) throw new Error(j.error||"Error");
  return j.data;
}

// ── DOUBLE-CLICK PREVENTION ────────────────
let S_busy = false;
async function guard(fn) {
  if(S_busy) return;
  S_busy = true;
  document.querySelectorAll('.sb,.sab.show').forEach(b=>b.disabled=true);
  try { await fn(); }
  finally {
    S_busy = false;
    document.querySelectorAll('.sb,.sab').forEach(b=>b.disabled=false);
  }
}

// Compress image then upload via POST text/plain (avoids CORS preflight)
async function apiUpload(tareaId, proyId, file) {
  // Step 1: compress if image
  const compressed = await compressFile(file);
  // Step 2: convert to base64
  const base64 = await toBase64(compressed);
  const payload = JSON.stringify({
    action:"uploadFile",
    tareaId: tareaId||"",
    proyId:  proyId||"",
    filename: file.name,
    base64,
    mimeType: compressed.type||file.type
  });
  // Step 3: POST with text/plain — no preflight, Apps Script reads postData.contents
  const r = await fetch(SCRIPT_URL, {
    method: "POST",
    body: payload,
    headers: {"Content-Type":"text/plain;charset=utf-8"}
  });
  const t = await r.text();
  let j; try{j=JSON.parse(t);}catch(e){throw new Error("Respuesta inválida del servidor");}
  if(!j.ok) throw new Error(j.error||"Error al subir archivo");
  return j.data;
}

function toBase64(file) {
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(",")[1]);
    r.onerror=()=>rej(new Error("Error leyendo archivo"));
    r.readAsDataURL(file);
  });
}

function compressFile(file) {
  // Only compress images, pass other files through
  if(!file.type.startsWith("image/")) return Promise.resolve(file);
  return new Promise((res,rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 900; // max dimension px
      let w=img.width, h=img.height;
      if(w>MAX||h>MAX) {
        if(w>h){ h=Math.round(h*MAX/w); w=MAX; }
        else   { w=Math.round(w*MAX/h); h=MAX; }
      }
      const canvas = document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        if(!blob) { res(file); return; }
        res(new File([blob], file.name, {type:"image/jpeg"}));
      }, "image/jpeg", 0.75);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

// ── HELPERS ───────────────────────────────
const $  = id => document.getElementById(id);
const qp = n  => new URLSearchParams(window.location.search).get(n);
const genUid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const bool = v => v===true||v==="TRUE"||v==="true";
const toArr = v => { if(!v)return[]; if(Array.isArray(v))return v.filter(Boolean); return String(v).split(",").map(s=>s.trim()).filter(Boolean); };
const uname = id => USERS[id]?.name||id;
const anames = arr => toArr(arr).map(uname).join(", ");

function parseDate(s) {
  // Handles: "2025-06-10", "10/06/2025", "06/10/2025", Date objects, serial numbers from Sheets
  if(!s) return null;
  if(s instanceof Date) return s;
  const str = String(s).trim();
  if(!str || str==="—") return null;
  // ISO format YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(str)) return new Date(str+"T12:00:00");
  // DD/MM/YYYY
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(str)) {
    const [d,m,y]=str.split("/"); return new Date(`${y}-${m}-${d}T12:00:00`);
  }
  // MM/DD/YYYY
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)) {
    const parts=str.split("/"); return new Date(`${parts[2]}-${parts[0].padStart(2,'0')}-${parts[1].padStart(2,'0')}T12:00:00`);
  }
  // Google Sheets serial number (days since Dec 30 1899)
  if(/^\d+$/.test(str)) {
    const d=new Date(1899,11,30); d.setDate(d.getDate()+Number(str)); return d;
  }
  const d=new Date(str); return isNaN(d)?null:d;
}
function fmtDate(s) {
  const d=parseDate(s); if(!d) return "—";
  return d.toLocaleDateString("es-PE",{day:"2-digit",month:"short",year:"2-digit"});
}
function dSt(s) {
  const d=parseDate(s); if(!d) return "ok";
  const diff=Math.round((d-new Date())/86400000);
  return diff<0?"ovr":diff<=1?"soon":"ok";
}
function dHtml(s) {
  const st=dSt(s);
  if(st==="ovr")  return`<span style="color:var(--er);font-weight:600;">⚠️ ${fmtDate(s)}</span>`;
  if(st==="soon") return`<span style="color:var(--wn);font-weight:600;">🔔 ${fmtDate(s)}</span>`;
  return`<span style="color:var(--g6);">${fmtDate(s)}</span>`;
}
function pct(a) { return a==="done"?100:a==="progress"?50:0; }
function ppct(proj) {
  if(!proj.phases||!proj.phases.length) return 0;
  return Math.round(proj.phases.filter(f=>f.action==="done").length/proj.phases.length*100);
}
function sortTasks(list) {
  const pri = t => { const s=dSt(t.dueDate); return s==="ovr"?0:s==="soon"?1:2; };
  return [...list].sort((a,b)=>pri(a)-pri(b)||(new Date(a.dueDate||"9999")-new Date(b.dueDate||"9999")));
}
function rowPrioClass(t) {
  const s=dSt(t.dueDate);
  return s==="ovr"?"prio-ovr":s==="soon"?"prio-soon":"prio-ok";
}
function toast(m) {
  document.querySelectorAll(".tst").forEach(e=>e.remove());
  const el=document.createElement("div");
  el.className="tst"; el.textContent=m;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),4000);
}
function descHtml(t) {
  if(!t) return "";
  // Auto-link URLs
  return t.replace(/https?:\/\/[^\s]+/g, u=>`<a href="${u}" target="_blank">${u}</a>`);
}

// ── BOOT ──────────────────────────────────
async function boot() {
  const id = qp("user");
  if(!id||!USERS[id]){ renderLogin(); return; }
  S.uid=id; S.user=USERS[id];
  S.selW = Object.keys(USERS).find(k=>USERS[k].role==="worker");
  document.body.innerHTML=`<div class="spin-wrap"><div class="spin"></div></div>`;
  try {
    const d = await api("init",{userId:id});
    S.tareas    = (d.tareas||[]).map(t=>({...t,assignedTo:toArr(t.assignedTo),completed:bool(t.completed)}));
    S.proyectos = (d.proyectos||[]).map(p=>({...p,assignedTo:toArr(p.assignedTo),phases:p.phases||[],completed:bool(p.completed)}));
    S.conteos   = d.conteos||[];
  } catch(e) {
    document.body.innerHTML=`<div style="padding:40px;text-align:center;color:var(--er);">
      <div style="font-size:28px;margin-bottom:10px;">⚠️</div>
      <b>${e.message}</b><br><span style="font-size:11px;color:var(--g4);margin-top:6px;display:block;">Verifica SCRIPT_URL</span></div>`;
    return;
  }
  render();
}

async function reload() {
  try {
    const d = await api("init",{userId:S.uid});
    S.tareas    = (d.tareas||[]).map(t=>({...t,assignedTo:toArr(t.assignedTo),completed:bool(t.completed)}));
    S.proyectos = (d.proyectos||[]).map(p=>({...p,assignedTo:toArr(p.assignedTo),phases:p.phases||[],completed:bool(p.completed)}));
    S.conteos   = d.conteos||[];
  } catch(e) { toast("Error al cargar: "+e.message); }
}

function startClock() {
  // Update immediately then every second
  updateClock();
  if(window._clockInterval) clearInterval(window._clockInterval);
  window._clockInterval = setInterval(updateClock, 1000);
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const clockEl = document.getElementById('clock-display');
  if(clockEl) clockEl.textContent = h+':'+m+':'+s;
  const days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const dateStr = days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear();
  const dateEl = document.getElementById('date-display');
  if(dateEl) dateEl.textContent = dateStr;
}

// ── MODAL ASSIGN HELPERS ──────────────────
function setModalType(t) { S.modal._itemType=t; render(); }

function filterAssign(val) {
  S.assignSearch=val;
  const drop=$("assign-drop");
  if(!drop) return;
  if(!val.trim()){ drop.style.display="none"; return; }
  const matches=Object.entries(USERS)
    .filter(([uid,u])=>u.name.toLowerCase().includes(val.toLowerCase())&&!S.assignSelected.includes(uid));
  drop.style.display=matches.length?"block":"none";
  drop.innerHTML=matches.map(([uid,u])=>`
    <div class="di" onclick="addAssign('${uid}')">
      <div class="av" style="width:22px;height:22px;font-size:9px;background:var(--${u.role==='admin'?'nvm':'or'});color:#fff;">${u.initials}</div>
      ${u.name} <span style="font-size:10px;color:var(--g4);margin-left:4px;">${u.role==='admin'?'Admin':u.area}</span>
    </div>`).join("");
}

function addAssign(uid) {
  if(!S.assignSelected.includes(uid)) S.assignSelected.push(uid);
  S.assignSearch=""; render();
}
function removeAssign(uid) {
  S.assignSelected=S.assignSelected.filter(x=>x!==uid);
  if(S.assignLeader===uid) S.assignLeader=null;
  render();
}
function setAssignLeader(uid) { S.assignLeader=uid||null; }

// New project phase builder (before project is created)
function addNewPhase() {
  if(!S.newProjPhases) S.newProjPhases=[];
  S.newProjPhases.push({name:"",desc:"",dueDate:""});
  render();
}
function removeNewPhase(i) { S.newProjPhases.splice(i,1); render(); }
function updateNewPhase(i,field,val) {
  if(!S.newProjPhases[i]) return;
  S.newProjPhases[i][field]=val;
}

// ── SAVE NEW (task or project) ────────────
async function doSaveNew(isSelf) {
  const type  = S.modal._itemType||"task";
  const area  = $("f-area")?.value||"";
  const topic = $("f-topic")?.value.trim()||"";
  const desc  = $("f-desc")?.value.trim()||"";
  const date  = $("f-date")?.value||"";

  // Save draft so nothing is lost if validation fails
  S.modal._draft = {area,topic,desc,date};

  if(!area||!topic||!date){ toast("Completa área, tema y fecha."); return; }

  let assignedTo;
  if(isSelf==="true") assignedTo=[S.uid];
  else if(S.assignSelected.length) assignedTo=S.assignSelected;
  else if(S.adminWView==="team"&&S.selW) assignedTo=[S.selW];
  else { toast("Selecciona al menos una persona para asignar."); return; }

  const leader = S.assignLeader || "";

  if(type==="task") {
    const res = await api("saveTarea",{},{tarea:{area,topic,desc,dueDate:date,assignedTo,assignedBy:S.uid,leader}});
    if(S_assignFile && res?.id) {
      toast("Subiendo adjunto ⏳");
      try { await apiUpload(res.id, null, S_assignFile); } catch(e){ toast("Adjunto no subido: "+e.message); }
      S_assignFile = null;
    }
    toast(assignedTo.includes(S.uid)&&assignedTo.length===1?"Tarea creada.":"Tarea creada y notificaciones enviadas.");
  } else {
    const phases = (S.newProjPhases||[])
      .filter(p=>p.name&&p.name.trim())
      .map(p=>({id:genUid(),name:p.name.trim(),desc:p.desc||"",dueDate:p.dueDate||"",action:"pending",support:"",fileId:"",fileUrl:""}));
    const resP = await api("saveProyecto",{},{proyecto:{name:topic,area,desc,dueDate:date,assignedTo,assignedBy:S.uid,leader,phases}});
    if(S_assignFile && resP?.id) {
      toast("Subiendo adjunto ⏳");
      try { await apiUpload(null, resP.id, S_assignFile); } catch(e){ toast("Adjunto no subido: "+e.message); }
      S_assignFile = null;
    }
    toast(assignedTo.includes(S.uid)&&assignedTo.length===1?"Proyecto creado.":"Proyecto creado y notificaciones enviadas.");
  }
  closeModal();
  await reload(); render();
}

// ── PHASE FILE UPLOAD ─────────────────────
async function doUploadPhase(projId, phId, input) {
  const file=input.files[0]; if(!file) return;
  if(file.size>4*1024*1024){ toast("Máx. 4MB por archivo."); return; }
  toast("Subiendo archivo... ⏳");
  try {
    await apiUploadPhase(projId, phId, file);
    toast("✅ Archivo guardado en Drive.");
    closeModal(); S.expProj[projId]=true; await reload(); render();
  } catch(err){ toast("Error al subir: "+err.message); }
}

async function apiUploadPhase(projId, phId, file) {
  const compressed = await compressFile(file);
  const base64 = await toBase64(compressed);
  const payload = JSON.stringify({
    action:"uploadFile", proyId:projId, faseId:phId,
    filename:file.name, base64, mimeType:compressed.type||file.type
  });
  const r = await fetch(SCRIPT_URL, { method:"POST", body:payload, headers:{"Content-Type":"text/plain;charset=utf-8"} });
  const t = await r.text();
  let j; try{j=JSON.parse(t);}catch(e){throw new Error("Respuesta inválida");}
  if(!j.ok) throw new Error(j.error||"Error al subir");
  return j.data;
}

function initPasteZonePhase(projId, phId) {
  window._pasteHandler = async function(e) {
    const items = e.clipboardData?.items;
    if(!items) return;
    for(const item of items) {
      if(item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if(!file) return;
        toast("Imagen pegada — subiendo ⏳");
        try {
          await apiUploadPhase(projId, phId, file);
          toast("✅ Screenshot guardado en Drive.");
          closeModal(); S.expProj[projId]=true; await reload(); render();
        } catch(err) { toast("Error: "+err.message); }
        return;
      }
    }
  };
  document.addEventListener('paste', window._pasteHandler);
}

async function doSavePhaseSupport(projId, phId) {
  const selected = S.supportSelected||[];
  const msg = $("f-sup-msg")?.value.trim()||"";
  const fields={support:selected};
  if(selected.length){ fields._notifySupport=true; fields._supportMsg=msg; }
  await api("updateFase",{},{proyId:projId,faseId:phId,fields});
  toast(selected.length?`Apoyo solicitado a ${selected.map(uname).join(", ")}.`:"Apoyo removido.");
  S.supportSelected=null;
  closeModal(); S.expProj[projId]=true; await reload(); render();
}

// ── DELETE PHASE ───────────────────────────
async function doDelFase(projId, phId) {
  if(!confirm("¿Eliminar esta fase?")) return;
  await api("deleteFase",{},{proyId:projId,faseId:phId});
  toast("Fase eliminada.");
  S.expProj[projId]=true; await reload(); render();
}

// ── SAVE PHASE EDIT ───────────────────────
async function doSavePhaseEdit(projId,phId) {
  const name   = $("f-phname")?.value.trim()||"";
  const desc   = $("f-phdesc")?.value.trim()||"";
  const dueDate= $("f-phdate")?.value||"";
  if(!name){ toast("Escribe el nombre de la fase."); return; }
  const proj=S.proyectos.find(p=>p.id===projId);
  const phases=JSON.parse(JSON.stringify(proj?.phases||[]));
  if(phId==="new") {
    phases.push({id:genUid(),name,desc,dueDate,action:"pending",support:"",fileId:"",fileUrl:""});
  } else {
    const i=phases.findIndex(p=>p.id===phId);
    if(i>=0) phases[i]={...phases[i],name,desc,dueDate};
  }
  await api("saveProyecto",{},{proyecto:{...proj,phases,assignedTo:toArr(proj.assignedTo)}});
  toast("Fase guardada.");
  closeModal(); S.expProj[projId]=true; await reload(); render();
}

// ── PENDING ACTION ────────────────────────
function setPendAct(tid,val) {
  S.pendAct[tid]=val;
  const btn=document.querySelector(`.sab[data-sab="${tid}"]`);
  const t=S.tareas.find(x=>x.id===tid);
  if(btn) btn.classList.toggle("show", val!==t?.action);
}

function setPendPhase(pk,val) {
  S.pendPhase[pk]=val;
  const btn=document.querySelector(`.sab[data-phk="${pk}"]`);
  const[projId,phId]=pk.split("_");
  const proj=S.proyectos.find(p=>p.id===projId);
  const ph=(proj?.phases||[]).find(f=>f.id===phId);
  if(btn) btn.classList.toggle("show", val!==ph?.action);
}

async function doSaveAct(tid) {
  const action=S.pendAct[tid]; if(!action) return;
  if(action==="done") {
    if(!confirm("¿Marcar como finalizada? Pasará a completadas y se borrará en 1 semana.")) return;
    await api("completeTarea",{},{id:tid});
    toast("✅ Completada. Admins notificados.");
  } else {
    await api("updateTarea",{},{id:tid,fields:{action}});
    toast("Progreso guardado.");
  }
  delete S.pendAct[tid]; await reload(); render();
}

async function doSavePhase(projId,phId,pk) {
  const action=S.pendPhase[pk]; if(!action) return;
  await api("updateFase",{},{proyId:projId,faseId:phId,fields:{action}});
  if(action==="done") toast("Fase completada. Admins notificados.");
  else toast("Fase actualizada.");
  delete S.pendPhase[pk]; S.expProj[projId]=true; await reload(); render();
}

// ── SUPPORT ───────────────────────────────
function filterSupport(val) {
  const drop=$("sup-drop");
  if(!drop) return;
  if(!val.trim()){ drop.style.display="none"; return; }
  const matches=Object.entries(USERS)
    .filter(([uid])=>uid!==S.uid && !(S.supportSelected||[]).includes(uid))
    .filter(([,u])=>u.name.toLowerCase().includes(val.toLowerCase()));
  drop.style.display=matches.length?"block":"none";
  drop.innerHTML=matches.map(([uid,u])=>`
    <div class="di" onclick="addSupportSel('${uid}')">
      <div class="av" style="width:22px;height:22px;font-size:9px;background:var(--${u.role==='admin'?'nvm':'or'});color:#fff;">${u.initials}</div>
      ${u.name}
    </div>`).join("");
}
function addSupportSel(uid) {
  if(!S.supportSelected) S.supportSelected=[];
  if(!S.supportSelected.includes(uid)) S.supportSelected.push(uid);
  render();
}
function removeSupportSel(uid) {
  S.supportSelected=(S.supportSelected||[]).filter(x=>x!==uid);
  render();
}

async function doSaveSupport(tid) {
  const selected = S.supportSelected||[];
  const msg = $("f-sup-msg")?.value.trim()||"";
  const fields={support:selected};
  if(selected.length){ fields._notifySupport=true; fields._supportMsg=msg; }
  await api("updateTarea",{},{id:tid,fields});
  toast(selected.length?`Apoyo solicitado a ${selected.map(uname).join(", ")}.`:"Apoyo removido.");
  S.supportSelected=null;
  closeModal(); await reload(); render();
}

// ── NOTE ──────────────────────────────────
async function doSaveNote(tid) {
  const ta=document.querySelector(`textarea[data-nid="${tid}"]`);
  if(!ta) return;
  await api("updateTarea",{},{id:tid,fields:{note:ta.value}});
  const t=S.tareas.find(x=>x.id===tid); if(t) t.note=ta.value;
  toast("Nota guardada.");
  // update dot without full render
  const btn=document.querySelector(`button[onclick="toggleNote('${tid}')"]`);
  if(btn&&ta.value.trim()&&!btn.querySelector(".nd")) {
    const d=document.createElement("span"); d.className="nd"; btn.appendChild(d);
  }
}

// ── FILE ──────────────────────────────────
async function doUpload(tareaId,proyId,input) {
  const file=input.files[0]; if(!file) return;
  if(file.size>4*1024*1024){ toast("Máx. 4MB por archivo."); return; }
  toast("Subiendo archivo... puede tardar unos segundos ⏳");
  try {
    await apiUpload(tareaId, proyId, file);
    toast("✅ Archivo guardado en Google Drive.");
    closeModal(); await reload(); render();
  } catch(err){ toast("Error al subir: "+err.message); }
}

async function doDelFile(tareaId,fileId,proyId,faseId) {
  if(!confirm("¿Eliminar adjunto?")) return;
  await api("deleteFile",{},{fileId,tareaId,proyId,faseId});
  toast("Adjunto eliminado.");
  closeModal(); if(proyId) S.expProj[proyId]=true; await reload(); render();
}

// ── DELETE ────────────────────────────────
async function doDelTask(id) {
  if(!confirm("¿Eliminar tarea?")) return;
  await api("deleteTarea",{},{id}); toast("Tarea eliminada.");
  await reload(); render();
}
async function doDelProj(id) {
  if(!confirm("¿Eliminar proyecto?")) return;
  await api("deleteProyecto",{},{id}); toast("Proyecto eliminado.");
  await reload(); render();
}

// ── TOGGLES ───────────────────────────────
function toggleNote(id) { S.expNote[id]=!S.expNote[id]; render(); }
function toggleProj(id) { S.expProj[id]=!S.expProj[id]; render(); }
function toggleComp()   { S.showComp=!S.showComp; render(); }
function setTab(t)      { S.tab=t; render(); }
function setAV(v)       { S.adminWView=v; render(); }
function pickWorker(id) { S.selW=id; S.adminWView="team"; render(); }

// ── PASTE & FILE HELPERS ─────────────────
let S_assignFile = null; // holds pending file for new task

function setAssignFile(input) {
  const file = input.files[0];
  if(!file) return;
  S_assignFile = file;
  showFilePreview('paste-preview-assign', file);
}

function showFilePreview(containerId, file) {
  const el = document.getElementById(containerId);
  if(!el) return;
  if(file.type.startsWith('image/')) {
    const url = URL.createObjectURL(file);
    el.innerHTML = `<img src="${url}" style="max-height:80px;max-width:200px;border-radius:6px;border:1px solid var(--g3);">
      <div style="font-size:10px;color:var(--g4);margin-top:3px;">✅ ${file.name}</div>`;
  } else {
    el.innerHTML = `<div style="font-size:11px;color:var(--ok);">✅ ${file.name}</div>`;
  }
}

function initPasteZone(zoneId, tareaId, proyId) {
  // Listen for paste globally while modal is open
  window._pasteHandler = async function(e) {
    const items = e.clipboardData?.items;
    if(!items) return;
    for(const item of items) {
      if(item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if(!file) return;
        toast("Imagen pegada — subiendo ⏳");
        try {
          await apiUpload(tareaId, proyId, file);
          toast("✅ Screenshot guardado en Drive.");
          closeModal(); await reload(); render();
        } catch(err) { toast("Error: "+err.message); }
        return;
      }
    }
  };
  document.addEventListener('paste', window._pasteHandler);
  // Remove listener when modal closes
  const overlay = document.querySelector('.mo');
  if(overlay) overlay.addEventListener('click', removePasteHandler, {once:true});
}

function initPasteZoneAssign(zoneId) {
  window._pasteHandlerAssign = function(e) {
    const items = e.clipboardData?.items;
    if(!items) return;
    for(const item of items) {
      if(item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if(!file) return;
        S_assignFile = file;
        showFilePreview('paste-preview-assign', file);
        toast("📋 Screenshot listo para adjuntar.");
        return;
      }
    }
  };
  document.addEventListener('paste', window._pasteHandlerAssign);
}

function removePasteHandler() {
  if(window._pasteHandler) {
    document.removeEventListener('paste', window._pasteHandler);
    window._pasteHandler = null;
  }
  if(window._pasteHandlerAssign) {
    document.removeEventListener('paste', window._pasteHandlerAssign);
    window._pasteHandlerAssign = null;
  }
}

function restoreNotes() {
  document.querySelectorAll("textarea[data-nid]").forEach(ta=>{
    const t=S.tareas.find(x=>x.id===ta.dataset.nid);
    if(t) ta.value=t.note||"";
  });
}

function bindAll() {
  const fns={openModal,closeModal,setModalType,filterAssign,addAssign,removeAssign,
    setAssignLeader,addNewPhase,removeNewPhase,updateNewPhase,
    doSaveNew,doEditTask,doEditProject,doSavePhaseEdit,setPendAct,setPendPhase,
    doSaveAct,doSavePhase,doSaveSupport,doSaveNote,doUpload,doDelFile,
    doDelTask,doDelProj,doDelFase,doUploadPhase,doSavePhaseSupport,
    filterSupport,addSupportSel,removeSupportSel,
    toggleNote,toggleProj,toggleComp,setTab,setAV,pickWorker,
    setAssignFile,initPasteZone,initPasteZoneAssign,initPasteZonePhase,removePasteHandler,
    guard};
  Object.entries(fns).forEach(([k,v])=>window[k]=v);
}

boot();
</script>
